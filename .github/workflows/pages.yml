name: Deploy GitHub Pages

on:
  schedule:
    # Redeploy the latest collection at the same-day recovery windows.
    - cron: "17 12,18,23 * * *"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - "config/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p dist/data/archive dist/config
          cp -R site/. dist/
          cp data/history.csv data/status.json dist/data/
          cp data/archive/history.csv dist/data/archive/
          cp config/sources.json dist/config/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
