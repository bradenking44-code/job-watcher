name: Daily job collection

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/daily-pipeline.yml"

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: daily-job-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Collect job boards and rebuild history
        id: collect
        run: python -u -m job_watcher.pipeline
        continue-on-error: true
      - name: Create or update today's issue and close yesterday's issue
        if: always() && steps.collect.outcome != 'cancelled'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const statusPath = 'data/status.json';
            const runDate = fs.existsSync(statusPath)
              ? JSON.parse(fs.readFileSync(statusPath, 'utf8')).run_date
              : new Date().toISOString().slice(0, 10);
            const title = `[Job Watcher] ${runDate} updates`;
            const body = fs.existsSync('data/daily_changes.md')
              ? fs.readFileSync('data/daily_changes.md', 'utf8')
              : `# Job Watcher updates — ${runDate}\n\nThe collection did not finish. See the workflow run for details.`;
            const findIssue = async (issueTitle) => {
              const result = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${issueTitle}"`,
                per_page: 100
              });
              return result.data.items.find((item) => item.title === issueTitle && !item.pull_request);
            };
            const dayBefore = new Date(`${runDate}T00:00:00Z`);
            dayBefore.setUTCDate(dayBefore.getUTCDate() - 1);
            const previousTitle = `[Job Watcher] ${dayBefore.toISOString().slice(0, 10)} updates`;
            const previous = await findIssue(previousTitle);
            if (previous && previous.state === 'open') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: previous.number,
                state: 'closed'
              });
              core.info(`Closed ${previousTitle}.`);
            }
            const current = await findIssue(title);
            if (current) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: current.number,
                body,
                state: 'open'
              });
              core.info(`Updated ${current.html_url}.`);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              core.info(`Opened ${issue.data.html_url}.`);
            }
      - name: Commit raw snapshots, history, and status
        id: commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/archive data/history.csv data/status.json data/daily_changes.md
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update job watcher data $(date -u +%F)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish updated site data
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Fail the run if every employer board failed
        if: steps.collect.outcome == 'failure'
        run: |
          echo "No employer job board completed successfully. See data/status.json for source errors."
          exit 1
