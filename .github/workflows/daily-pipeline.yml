name: Daily job collection

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/daily-pipeline.yml"

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: daily-job-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Collect job boards and rebuild history
        id: collect
        run: python -u -m job_watcher.pipeline
        continue-on-error: true
      - name: Open a dated issue for local job changes
        if: steps.collect.outcome == 'success' && steps.collect.outputs.changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = JSON.parse(fs.readFileSync('data/status.json', 'utf8'));
            const runDate = status.run_date;
            const title = `[Job Watcher] ${runDate} updates`;
            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} in:title "${title}"`,
              per_page: 10
            });
            if (search.data.items.some((item) => item.title === title && !item.pull_request)) {
              core.info(`Issue already exists for ${runDate}.`);
            } else {
              const body = fs.readFileSync('data/daily_changes.md', 'utf8');
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              core.info(`Opened ${issue.data.html_url}`);
            }
      - name: Commit raw snapshots, history, and status
        id: commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/history.csv data/status.json data/daily_changes.md
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update job watcher data $(date -u +%F)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh GitHub Pages after a data commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - name: Fail the run if every employer board failed
        if: steps.collect.outcome == 'failure'
        run: |
          echo "No employer job board completed successfully. See data/status.json for source errors."
          exit 1
