name: Daily job collection

on:
  schedule:
    # Morning collection plus same-day recovery windows (UTC).
    - cron: "17 12,18,23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/daily-pipeline.yml"

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: daily-job-collection
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check whether today's collection is complete
        id: check
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          config = json.loads(Path("config/sources.json").read_text())
          status_path = Path("data/status.json")
          status = json.loads(status_path.read_text()) if status_path.exists() else {}
          today = datetime.now(timezone.utc).date().isoformat()
          expected = len(config.get("sources", []))
          sources = status.get("sources", [])
          complete = (
              status.get("run_date") == today
              and len(sources) == expected
              and expected > 0
              and all(source.get("ok") for source in sources)
          )
          print(f"Today's collection complete: {complete} ({sum(bool(source.get('ok')) for source in sources)}/{expected} sources)")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"skip={'true' if complete else 'false'}\n")
          PY

  collect:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Collect job boards and rebuild history
        id: collect
        run: python -u -m job_watcher.pipeline
        continue-on-error: true
      - name: Create or update today's issue and close yesterday's issue
        if: always() && steps.collect.outcome != 'cancelled'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const statusPath = 'data/status.json';
            const runDate = fs.existsSync(statusPath)
              ? JSON.parse(fs.readFileSync(statusPath, 'utf8')).run_date
              : new Date().toISOString().slice(0, 10);
            const title = `[Job Watcher] ${runDate} updates`;
            const body = fs.existsSync('data/daily_changes.md')
              ? fs.readFileSync('data/daily_changes.md', 'utf8')
              : `# Job Watcher updates — ${runDate}\n\nThe collection did not finish. See the workflow run for details.`;
            const reportParts = [];
            let currentPart = '';
            for (const line of body.split('\n')) {
              const nextLine = `${line}\n`;
              if (currentPart && currentPart.length + nextLine.length > 48000) {
                reportParts.push(currentPart);
                currentPart = '';
              }
              currentPart += nextLine;
            }
            if (currentPart || !reportParts.length) reportParts.push(currentPart);
            const issueBody = reportParts[0] + (reportParts.length > 1
              ? `\n\n_The complete report continues in ${reportParts.length - 1} comments below._`
              : '');
            const continuationMarker = '<!-- job-watcher-report-chunk -->';
            const reportComments = reportParts.slice(1).map((part, index) =>
              `${continuationMarker}\n## Report continued (${index + 1} of ${reportParts.length - 1})\n\n${part}`
            );
            const findIssue = async (issueTitle) => {
              const result = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${issueTitle}"`,
                per_page: 100
              });
              return result.data.items.find((item) => item.title === issueTitle && !item.pull_request);
            };
            const dayBefore = new Date(`${runDate}T00:00:00Z`);
            dayBefore.setUTCDate(dayBefore.getUTCDate() - 1);
            const previousTitle = `[Job Watcher] ${dayBefore.toISOString().slice(0, 10)} updates`;
            const previous = await findIssue(previousTitle);
            if (previous && previous.state === 'open') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: previous.number,
                state: 'closed'
              });
              core.info(`Closed ${previousTitle}.`);
            }
            const current = await findIssue(title);
            let issue;
            if (current) {
              const updated = await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: current.number,
                body: issueBody,
                state: 'open'
              });
              issue = updated.data;
              core.info(`Updated ${issue.html_url}.`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: issueBody
              });
              issue = created.data;
              core.info(`Opened ${issue.html_url}.`);
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100
            });
            const oldReportComments = comments.filter((comment) => comment.body.includes(continuationMarker));
            for (let index = 0; index < reportComments.length; index += 1) {
              if (index < oldReportComments.length) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: oldReportComments[index].id,
                  body: reportComments[index]
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: reportComments[index]
                });
              }
            }
            for (const stale of oldReportComments.slice(reportComments.length)) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: stale.id
              });
            }
      - name: Commit raw snapshots, history, and status
        id: commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/archive data/history.csv data/status.json data/daily_changes.md
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update job watcher data $(date -u +%F)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish updated site data
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Fail the run if every employer board failed
        if: steps.collect.outcome == 'failure'
        run: |
          echo "No employer job board completed successfully. See data/status.json for source errors."
          exit 1
